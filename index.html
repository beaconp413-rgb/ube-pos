<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b2a86">
<title>Ube POS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="top">
  <div class="brand"><img src="icons/icon.svg" alt=""><div><b id="hdrTitle">Ube POS</b><small id="hdrSub"></small></div></div>
  <button class="seller-chip" id="sellerChip" title="Who is selling"></button>
</header>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-tab="home"><span>🏠</span>Home</button>
  <button data-tab="sell"><span>🛒</span>Sell</button>
  <button data-tab="stock"><span>🧊</span>Stock</button>
  <button data-tab="orders"><span>📋</span>Orders</button>
  <button data-tab="more"><span>☰</span>More</button>
</nav>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
<script src="cloud.js"></script>
</body>
</html>
