name: Keep Supabase awake
# Free Supabase projects pause after 7 days without activity. This pings the database every 3 days.
on:
  schedule:
    - cron: '17 1 */3 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://ljlnrpwpvimtnklnyhvk.supabase.co/rest/v1/teams?select=id&limit=1" \
            -H "apikey: sb_publishable_RTG8zn9lDbq32qIo4jC3_A_7_1SrzpH")
          echo "HTTP $code"
          test "$code" = 200
